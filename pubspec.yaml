name: stone_town_heritage_vt_guide
description: "Digital tour guide for Stone Town, Zanzibar UNESCO World Heritage Site"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  # State Management
  flutter_bloc: ^9.1.1

  # Storage & Preferences
  shared_preferences: ^2.5.3

  # Networking & Images
  cached_network_image: ^3.4.1
  http: ^1.2.0
  image_picker: ^1.0.7

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # Location & Maps
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Permissions
  permission_handler: ^11.4.0

  # Path / disk cache (tile cache)
  path_provider: ^2.1.5

  # Utilities
  url_launcher: ^6.3.1
  package_info_plus: ^8.2.0
  equatable: ^2.0.7
  google_sign_in: ^6.2.2

  # UI Components
  shimmer: ^3.0.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/localization/